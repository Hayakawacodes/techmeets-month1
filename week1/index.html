<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ToDoリスト</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 40px 16px;
      background: #f2f4f7;
      font-family: "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif;
      color: #333;
    }

    .container {
      max-width: 480px;
      margin: 0 auto;
      padding: 24px;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
    }

    h1 {
      margin: 0 0 20px;
      font-size: 24px;
      text-align: center;
    }

    .form {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
    }

    .form input {
      flex: 1;
      padding: 10px 12px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 8px;
      outline: none;
    }

    .form input:focus {
      border-color: #4a90e2;
    }

    .form button {
      padding: 10px 16px;
      font-size: 16px;
      color: #fff;
      background: #4a90e2;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    .form button:hover {
      background: #357abd;
    }

    .todo-list {
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .todo-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px;
      margin-bottom: 8px;
      background: #fafafa;
      border-radius: 8px;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.06);
    }

    .todo-text {
      flex: 1;
      font-size: 18px;
      line-height: 1.5;
      cursor: pointer;
      word-break: break-all;
    }

    .todo-item.done .todo-text {
      text-decoration: line-through;
      color: #aaa;
    }

    .delete-btn {
      margin-left: 12px;
      padding: 6px 12px;
      font-size: 14px;
      color: #fff;
      background: #e25c5c;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    .delete-btn:hover {
      background: #c94444;
    }

    .empty {
      text-align: center;
      color: #999;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>ToDoリスト</h1>

    <form class="form" id="todo-form">
      <input type="text" id="todo-input" placeholder="タスクを入力してください">
      <button type="submit">追加</button>
    </form>

    <ul class="todo-list" id="todo-list"></ul>
  </div>

  <script>
    // タスクを管理する配列
    // 例: { text: "買い物", done: false }
    const todos = [];

    const form = document.getElementById("todo-form");
    const input = document.getElementById("todo-input");
    const list = document.getElementById("todo-list");

    // 配列の内容をもとに画面を描き直す
    function render() {
      list.innerHTML = "";

      if (todos.length === 0) {
        const empty = document.createElement("li");
        empty.className = "empty";
        empty.textContent = "タスクはありません";
        list.appendChild(empty);
        return;
      }

      todos.forEach((todo, index) => {
        const li = document.createElement("li");
        li.className = "todo-item";
        if (todo.done) {
          li.classList.add("done");
        }

        // タスク名（クリックで完了／未完了を切り替え）
        const span = document.createElement("span");
        span.className = "todo-text";
        span.textContent = todo.text;
        span.addEventListener("click", () => {
          todos[index].done = !todos[index].done;
          render();
        });

        // 削除ボタン
        const deleteBtn = document.createElement("button");
        deleteBtn.className = "delete-btn";
        deleteBtn.textContent = "削除";
        deleteBtn.addEventListener("click", () => {
          // 本当に削除してよいか確認する
          if (!confirm(`「${todo.text}」を削除してもよろしいですか？`)) {
            return;
          }
          todos.splice(index, 1);
          render();
        });

        li.appendChild(span);
        li.appendChild(deleteBtn);
        list.appendChild(li);
      });
    }

    // タスクを追加する
    form.addEventListener("submit", (event) => {
      event.preventDefault(); // ページの再読み込みを防ぐ

      const text = input.value.trim();
      if (text === "") {
        return;
      }

      todos.push({ text: text, done: false });
      input.value = "";
      render();
    });

    // 最初の表示
    render();
  </script>
</body>
</html>
