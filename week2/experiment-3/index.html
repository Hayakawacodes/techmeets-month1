<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ToDoリスト</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 40px 16px;
      background: #f2f4f7;
      font-family: "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif;
      color: #333;
    }

    .container {
      max-width: 480px;
      margin: 0 auto;
      padding: 24px;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
    }

    h1 {
      margin: 0 0 20px;
      font-size: 24px;
      text-align: center;
    }

    .form {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
    }

    .form input {
      flex: 1;
      padding: 10px 12px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 8px;
      outline: none;
    }

    .form input:focus {
      border-color: #4a90e2;
    }

    .form input[type="date"] {
      flex: 0 0 auto;
      font-size: 14px;
    }

    .todo-due {
      margin-left: 12px;
      font-size: 13px;
      color: #888;
      white-space: nowrap;
    }

    .form button {
      padding: 10px 16px;
      font-size: 16px;
      color: #fff;
      background: #4a90e2;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    .form button:hover {
      background: #357abd;
    }

    .form button:disabled {
      background: #b5cbe6;
      cursor: not-allowed;
    }

    .todo-list {
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .todo-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px;
      margin-bottom: 8px;
      background: #fafafa;
      border-radius: 8px;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.06);
    }

    .todo-text {
      flex: 1;
      font-size: 18px;
      line-height: 1.5;
      cursor: pointer;
      word-break: break-all;
    }

    .todo-item.done .todo-text {
      text-decoration: line-through;
      color: #aaa;
    }

    .delete-btn {
      margin-left: 12px;
      padding: 6px 12px;
      font-size: 14px;
      color: #fff;
      background: #e25c5c;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    .delete-btn:hover {
      background: #c94444;
    }

    .empty {
      text-align: center;
      color: #999;
    }

    .counter {
      margin: 0;
      font-size: 14px;
      color: #666;
    }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 12px;
    }

    .filters {
      display: flex;
      gap: 4px;
    }

    .search {
      width: 100%;
      margin-bottom: 12px;
      padding: 8px 12px;
      font-size: 14px;
      border: 1px solid #ccc;
      border-radius: 8px;
      outline: none;
    }

    .search:focus {
      border-color: #4a90e2;
    }

    .filter-btn {
      padding: 6px 12px;
      font-size: 14px;
      color: #4a90e2;
      background: #fff;
      border: 1px solid #4a90e2;
      border-radius: 6px;
      cursor: pointer;
    }

    .filter-btn:hover {
      background: #eef4fc;
    }

    .filter-btn.active {
      color: #fff;
      background: #4a90e2;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>ToDoリスト</h1>

    <form class="form" id="todo-form">
      <input type="text" id="todo-input" placeholder="タスクを入力してください">
      <input type="date" id="due-input" aria-label="締め切り日">
      <button type="submit" id="add-btn" disabled>追加</button>
    </form>

    <input type="search" class="search" id="search-input" placeholder="タスク名で検索">

    <div class="toolbar">
      <div class="filters" id="filters">
        <button type="button" class="filter-btn active" data-filter="all">すべて</button>
        <button type="button" class="filter-btn" data-filter="active">未完了のみ</button>
        <button type="button" class="filter-btn" data-filter="done">完了済みのみ</button>
      </div>
      <p class="counter" id="counter"></p>
    </div>

    <ul class="todo-list" id="todo-list"></ul>
  </div>

  <script>
    // localStorage に保存するときのキー
    const STORAGE_KEY = "todos";

    // 保存されているタスクを読み込む（なければ空の配列）
    function loadTodos() {
      try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
        return Array.isArray(saved) ? saved : [];
      } catch (error) {
        // データが壊れている・保存が使えない場合は空から始める
        return [];
      }
    }

    // タスクを localStorage に保存する
    function saveTodos() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(todos));
      } catch (error) {
        // 保存できない環境（プライベートモード等）では何もしない
      }
    }

    // タスクを管理する配列
    // 例: { text: "買い物", done: false, due: "2026-11-10" }（due は未設定なら空文字）
    const todos = loadTodos();

    const form = document.getElementById("todo-form");
    const input = document.getElementById("todo-input");
    const dueInput = document.getElementById("due-input");
    const list = document.getElementById("todo-list");
    const addBtn = document.getElementById("add-btn");
    const counter = document.getElementById("counter");
    const filterButtons = document.querySelectorAll(".filter-btn");

    // 現在のフィルター（"all" = すべて / "active" = 未完了 / "done" = 完了）
    let currentFilter = "all";

    // フィルターボタンを押したら表示を切り替える
    filterButtons.forEach((button) => {
      button.addEventListener("click", () => {
        currentFilter = button.dataset.filter;
        filterButtons.forEach((b) => b.classList.toggle("active", b === button));
        render();
      });
    });

    const searchInput = document.getElementById("search-input");

    // 検索ボックスに入力するたびに表示を絞り込む
    searchInput.addEventListener("input", render);

    // 検索キーワード（前後の空白を除き、大文字・小文字は区別しない）
    function getKeyword() {
      return searchInput.value.trim().toLowerCase();
    }

    // 状態フィルターと検索キーワードの両方に合うタスクかどうか
    function matchesFilter(todo) {
      if (currentFilter === "active" && todo.done) return false;
      if (currentFilter === "done" && !todo.done) return false;

      const keyword = getKeyword();
      return keyword === "" || todo.text.toLowerCase().includes(keyword);
    }

    // 入力が空（空白のみ含む）のときは追加ボタンを押せないようにする
    function updateAddButton() {
      addBtn.disabled = input.value.trim() === "";
    }

    input.addEventListener("input", updateAddButton);

    // 配列の内容をもとに画面を描き直す
    // 描き直すたびに保存もしておく（追加・完了・削除すべてに対応）
    function render() {
      saveTodos();
      list.innerHTML = "";

      // 完了件数 / 総件数を表示する
      const doneCount = todos.filter((todo) => todo.done).length;
      counter.textContent = `${doneCount} / ${todos.length} 件完了`;

      // フィルターに合うタスクだけを表示する
      // （削除・完了切り替えで元の配列を操作するため、元の位置 index も一緒に持っておく）
      const visibleTodos = todos
        .map((todo, index) => ({ todo, index }))
        .filter(({ todo }) => matchesFilter(todo));

      if (visibleTodos.length === 0) {
        const empty = document.createElement("li");
        empty.className = "empty";
        if (todos.length === 0) {
          empty.textContent = "タスクはありません";
        } else if (getKeyword() !== "") {
          empty.textContent = "条件に一致するタスクはありません";
        } else if (currentFilter === "active") {
          empty.textContent = "未完了のタスクはありません";
        } else {
          empty.textContent = "完了したタスクはありません";
        }
        list.appendChild(empty);
        return;
      }

      visibleTodos.forEach(({ todo, index }) => {
        const li = document.createElement("li");
        li.className = "todo-item";
        if (todo.done) {
          li.classList.add("done");
        }

        // タスク名（クリックで完了／未完了を切り替え）
        const span = document.createElement("span");
        span.className = "todo-text";
        span.textContent = todo.text;
        span.addEventListener("click", () => {
          todos[index].done = !todos[index].done;
          render();
        });

        // 削除ボタン
        const deleteBtn = document.createElement("button");
        deleteBtn.className = "delete-btn";
        deleteBtn.textContent = "削除";
        deleteBtn.addEventListener("click", () => {
          // 本当に削除してよいか確認する
          if (!confirm(`「${todo.text}」を削除してもよろしいですか？`)) {
            return;
          }
          todos.splice(index, 1);
          render();
        });

        li.appendChild(span);

        // 締め切り日（設定されている場合のみ表示。"2026-11-10" → "締切: 2026/11/10"）
        if (todo.due) {
          const due = document.createElement("span");
          due.className = "todo-due";
          due.textContent = `締切: ${todo.due.replace(/-/g, "/")}`;
          li.appendChild(due);
        }

        li.appendChild(deleteBtn);
        list.appendChild(li);
      });
    }

    // タスクを追加する
    form.addEventListener("submit", (event) => {
      event.preventDefault(); // ページの再読み込みを防ぐ

      // 空文字は追加しない（念のための二重チェック）
      const text = input.value.trim();
      if (text === "") {
        return;
      }

      todos.push({ text: text, done: false, due: dueInput.value });
      input.value = "";
      dueInput.value = "";
      updateAddButton();
      render();
    });

    // 最初の表示
    render();
  </script>
</body>
</html>
